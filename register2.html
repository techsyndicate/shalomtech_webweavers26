<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0;
            box-shadow: none !important;
            text-shadow: none !important;
            outline: none;
        }

        :root {
            --bg-main: #F4F5F7;
            --bg-card: #FFFFFF;
            --border-subtle: #E2E5EC;
            --border-strong: #111318;
            --text-primary: #111318;
            --text-muted: #5E6470;
            --accent-pink: #D81B60;
            --accent-pink-soft: #FCE4EC;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 32px;
            max-width: 480px;
            width: 100%;
        }

        .sub-status {
            display: none;
            background-color: var(--accent-pink-soft);
            border: 1px solid var(--accent-pink);
            padding: 16px;
            margin-bottom: 24px;
        }

        .sub-status.active {
            display: block;
        }

        .sub-status h3 {
            color: var(--accent-pink);
            font-size: 0.95rem;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .sub-status p {
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        .section {
            margin-bottom: 24px;
        }

        .section h2 {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--text-primary);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .field-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            font-size: 0.95rem;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: var(--border-strong);
            background-color: var(--bg-card);
        }

        input[readonly] {
            background-color: var(--border-subtle);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .card-box {
            border: 1px solid var(--border-subtle);
            padding: 16px;
            background-color: var(--bg-main);
        }

        .card-number-wrapper {
            position: relative;
        }

        .card-brands {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 4px;
        }

        .brand-tag {
            font-size: 10px;
            font-weight: 700;
            background: var(--bg-card);
            padding: 2px 4px;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
        }

        .card-grid {
            display: flex;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            margin-bottom: 16px;
        }

        .card-grid input {
            border: none;
            background: transparent;
        }

        .top-input {
            border-bottom: 1px solid var(--border-subtle) !important;
            border-radius: 0 !important;
        }

        .half-input {
            width: 50%;
        }

        .half-input:first-child {
            border-right: 1px solid var(--border-subtle);
        }

        .pay-btn {
            width: 100%;
            background-color: #111318;
            color: #FFFFFF;
            padding: 14px;
            border: none;
            border-radius: 2px;
            font-size: 0.88rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .pay-btn:hover {
            background-color: var(--accent-pink);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 14, 17, 0.85);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
        }

        .overlay.active {
            display: flex;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar-bg {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

  <div class="container">
    <div id="subscriptionStatus" class="sub-status">
      <h3>Active Subscription</h3>
      <p id="daysRemainingText">Loading subscription status...</p>
    </div>

    <form id="paymentForm">
      <div class="section">
        <h2>Contact information</h2>
        <div class="field-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="John Doe" required>
        </div>
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="email@example.com" required>
        </div>
      </div>

      <div class="section">
        <h2>Payment Amount</h2>
        <div class="field-group">
          <label for="paymentAmount">Amount (₹)</label>
          <input type="text" id="paymentAmount" value="₹ 1000 / month" readonly>
        </div>
      </div>

      <div class="section">
        <h2>Payment method</h2>
        <div class="card-box">
          <label>Card</label>
          <div class="field-group" style="margin-top: 8px;">
            <label style="font-size: 11px;">Card information</label>
            <div style="border: 1px solid var(--border-subtle); background: var(--bg-card);">
              <div class="card-number-wrapper">
                <input type="text" id="cardNumber" class="top-input" placeholder="1234 1234 1234 1234" maxlength="19" required>
                <div class="card-brands">
                  <span class="brand-tag">VISA</span>
                  <span class="brand-tag">MC</span>
                  <span class="brand-tag">AMEX</span>
                </div>
              </div>
              <div style="display: flex;">
                <input type="text" id="cardExpiry" class="half-input" placeholder="MM / YY" maxlength="5" required>
                <input type="text" id="cardCvc" class="half-input" placeholder="CVC" maxlength="4" required>
              </div>
            </div>
          </div>

          <div class="field-group">
            <label for="cardHolder">Cardholder name</label>
            <input type="text" id="cardHolder" placeholder="Full name on card" required>
          </div>

          <div class="field-group">
            <label for="country">Country or region</label>
            <select id="country">
              <option value="India" selected>India</option>
              <option value="United States">United States</option>
              <option value="United Kingdom">United Kingdom</option>
            </select>
          </div>
        </div>
      </div>

      <button type="submit" class="pay-btn">Pay</button>
    </form>
  </div>

  <div id="loadingOverlay" class="overlay">
    <div class="spinner"></div>
    <h2 style="font-size: 1rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase;">Buying subscription...</h2>
    <div class="progress-bar-bg">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>
  </div>

  <script>
    function checkExistingSubscription() {
      const subExpiry = localStorage.getItem('cycleSubExpiry');
      const statusDiv = document.getElementById('subscriptionStatus');
      const daysText = document.getElementById('daysRemainingText');

      if (subExpiry) {
        const expiryDate = new Date(subExpiry);
        const currentDate = new Date();
        const diffTime = expiryDate - currentDate;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays > 0) {
          statusDiv.classList.add('active');
          daysText.textContent = `You have ${diffDays} day(s) left on your active subscription.`;
        } else {
          statusDiv.classList.add('active');
          daysText.textContent = 'Your subscription has expired. Please renew below.';
        }
      }
    }

    document.getElementById('cardNumber').addEventListener('input', function (e) {
      let value = e.target.value.replace(/\D/g, '');
      value = value.replace(/(.{4})/g, '$1 ').trim();
      e.target.value = value.substring(0, 19);
    });

    document.getElementById('cardExpiry').addEventListener('input', function (e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length >= 2) {
        value = value.substring(0, 2) + ' / ' + value.substring(2, 4);
      }
      e.target.value = value.substring(0, 7);
    });

    document.getElementById('paymentForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const overlay = document.getElementById('loadingOverlay');
      const progressFill = document.getElementById('progressFill');
      overlay.classList.add('active');

      const expiryDate = new Date();
      expiryDate.setDate(expiryDate.getDate() + 30);
      localStorage.setItem('cycleSubExpiry', expiryDate.toISOString());

      let startTime = null;
      const duration = 5000;

      function animateProgress(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min((elapsed / duration) * 100, 100);
        progressFill.style.width = progress + '%';

        if (elapsed < duration) {
          requestAnimationFrame(animateProgress);
        } else {
          window.location.href = 'index.html';
        }
      }

      requestAnimationFrame(animateProgress);
    });

    window.addEventListener('DOMContentLoaded', checkExistingSubscription);
  </script>
</body>
</html>
