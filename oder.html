<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="2.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <title>Order Summary</title>

    <style>
        body {
            background-color: #ffffff;
        }

        .order-wrapper {
            margin-bottom: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
        }

        .product-preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background-color: #ffffff;
            padding: 12px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .product-preview-box img {
            width: 90px;
            height: 60px;
            object-fit: contain;
            border-radius: 5px;
            background: #fff;
            padding: 4px;
            border: 1px solid #e0e0e0;
        }

        .product-preview-details {
            text-align: left;
        }

        .product-preview-title {
            font-size: 0.8em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-preview-name {
            font-size: 1.05em;
            font-weight: bold;
            color: #222;
        }

        .progress-section {
            width: 100%;
            padding: 15px 0 10px 0;
            background-color: #f9f9f9;
        }

        .progress-track-wrapper {
            position: relative;
            width: 85%;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        .progress-bar-container {
            position: relative;
            flex-grow: 1;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            margin-right: 15px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .cycle-icon {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            object-fit: contain;
            transition: left 0.5s ease;
            z-index: 2;
        }

        .home-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .progress-text {
            font-size: 0.85em;
            margin-top: 8px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="two">
        <a class="five" href="index.html">HOME</a>
        <a class="five" href="shop.html">SHOP NOW</a>
        <a class="five" href="oder.html">ORDERS</a>
    </div>

    <div class="three">
        <h1>Click here to register your free ride today</h1>
        <a class="six" href="register.html">CLICK HERE</a>
    </div>

    <br><br>

    <center>
        <div class="card">
            <h2>Order Details</h2>

            <div class="order-headers">
                <div class="col">Email</div>
                <div class="col">Delivery Address</div>
                <div class="col">Bike</div>
                <div class="col">Amount</div>
                <div class="col">Date</div>
                <div class="col">Time</div>
                <div class="col">Expected / Actual Delivery</div>
            </div>

            <div class="orders-container" id="orders-container"></div>

            <div class="btn-group">
                <a href="index.html" class="btn">Home</a>
                <button onclick="clearOrders()" class="btn btn-clear">Clear History</button>
            </div>
        </div>
    </center>

    <script>
        const bikeNames = {
            "MTB": "1. MTB ST20",
            "ENDURANCE": "2. ENDURANCE EXPL 40",
            "EXPL 10": "EXPL 10",
            "EXPL10": "EXPL 10",
            "RODIE": "3. ROADIE RC 120",
            "ROADIE": "3. ROADIE RC 120",
            "FIXIE": "4. FIXIE RC 150",
            "HYBRID": "5. HYBRID RIVERSIDE 500",
            "RIVERSIDE 120": "6. HYBRID RIVERSIDE 120",
            "RIVERSIDE120": "6. HYBRID RIVERSIDE 120",
            "ST100": "ST100"
        };

        const bikeImages = {
            "MTB": "img5.png",
            "ENDURANCE": "img7.png",
            "EXPL 10": "img40.png",
            "EXPL10": "img40.png",
            "RODIE": "img6.png",
            "ROADIE": "img6.png",
            "FIXIE": "img8.png",
            "HYBRID": "img9.png",
            "RIVERSIDE 120": "img30.png",
            "RIVERSIDE120": "img30.png",
            "ST100": "img50.png"
        };

        const orders = JSON.parse(localStorage.getItem('ordersList')) || [];
        const container = document.getElementById('orders-container');

        function updateProgressBars() {
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<div style="padding: 20px; color: #888;">No orders found.</div>';
                return;
            }

            const now = new Date().getTime();

            orders.forEach((order) => {
                let deliveryTimeStr = '30 Mins';
                let progressPercent = 0;
                let statusText = '';

                let orderTimestamp = now;

                if (order.date && order.time) {
                    const parsedDate = new Date(`${order.date} ${order.time}`);

                    if (!isNaN(parsedDate.getTime())) {
                        orderTimestamp = parsedDate.getTime();
                    }
                }

                const totalDuration = 30 * 60 * 1000;
                const deliveryTimestamp = orderTimestamp + totalDuration;
                const timePassed = now - orderTimestamp;
                const timeRemaining = deliveryTimestamp - now;

                const delDate = new Date(deliveryTimestamp);

                const formattedTime = delDate.toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const formattedDate = delDate.toLocaleDateString([], {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });

                const formattedFullDateTime = `${delDate.toLocaleDateString([], {
                    day: '2-digit',
                    month: 'short'
                })}, ${formattedTime}`;

                if (timeRemaining <= 0) {
                    progressPercent = 100;
                    deliveryTimeStr = formattedFullDateTime;
                    statusText = `Delivered on ${formattedDate} at ${formattedTime}`;
                } else if (timePassed < 0) {
                    progressPercent = 0;
                    deliveryTimeStr = formattedTime;
                    statusText = 'Order Placed';
                } else {
                    progressPercent = Math.min(
                        100,
                        Math.max(0, (timePassed / totalDuration) * 100)
                    );

                    deliveryTimeStr = formattedTime;

                    const minsLeft = Math.ceil(timeRemaining / (1000 * 60));

                    statusText = `Delivery Progress: ${minsLeft} mins remaining`;
                }

                const cycleKey = order.cycle
                    ? order.cycle.toUpperCase().trim()
                    : '';

                const displayBike = bikeNames[cycleKey] || order.cycle || 'N/A';
                const productImage = bikeImages[cycleKey] || 'cycle67.png';

                const displayAmount = (
                    cycleKey === "RIVERSIDE 120" ||
                    cycleKey === "RIVERSIDE120" ||
                    cycleKey === "6. HYBRID RIVERSIDE 120"
                ) ? "99,999" : (order.amount || '0');

                const wrapper = document.createElement('div');
                wrapper.className = 'order-wrapper';

                wrapper.innerHTML = `
                    <div class="order-row">
                        <div class="col">${order.email || 'N/A'}</div>
                        <div class="col">${order.address || 'N/A'}</div>
                        <div class="col">${displayBike}</div>
                        <div class="col">₹${displayAmount}</div>
                        <div class="col">${order.date || 'N/A'}</div>
                        <div class="col">${order.time || 'N/A'}</div>
                        <div class="col">${deliveryTimeStr}</div>
                    </div>

                    <div class="product-preview-box">
                        <img src="${productImage}" alt="${displayBike}">
                        <div class="product-preview-details">
                            <div class="product-preview-title">Your Ordered Product</div>
                            <div class="product-preview-name">${displayBike}</div>
                        </div>
                    </div>

                    <div class="progress-section">
                        <div class="progress-track-wrapper">
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${progressPercent.toFixed(1)}%;"></div>
                                <img src="cycle67.png" alt="Bike" class="cycle-icon" style="left: ${progressPercent.toFixed(1)}%;">
                            </div>
                            <img src="house67.png" alt="House" class="home-icon">
                        </div>
                        <div class="progress-text">${statusText}</div>
                    </div>
                `;

                container.appendChild(wrapper);
            });
        }

        updateProgressBars();

        setInterval(updateProgressBars, 10000);

        function clearOrders() {
            localStorage.removeItem('ordersList');
            location.reload();
        }
    </script>

</body>
</html>
