<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — Riders Avenue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0;
            box-shadow: none !important;
            text-shadow: none !important;
            outline: none;
        }

        :root {
            --bg-main: #F4F5F7;
            --bg-card: #FFFFFF;
            --bg-nav: rgba(255, 255, 255, 0.95);
            --border-subtle: #E2E5EC;
            --border-strong: #111318;
            --text-primary: #111318;
            --text-muted: #5E6470;
            --text-subtle: #8C92A0;
            --accent-pink: #D81B60;
            --accent-pink-soft: #FCE4EC;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .two {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(8px);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 32px;
        }

        .five {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.15s ease;
        }

        .five:hover, .five.active {
            color: var(--text-primary);
        }

        .three {
            background-color: #111318;
            color: #FFFFFF;
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .three h1 {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: #D1D5DB;
            max-width: 1280px;
            margin: 0 auto;
        }

        .six {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background-color: #FFFFFF;
            color: #111318;
            padding: 8px 16px;
            border-radius: 2px;
            transition: background-color 0.15s ease;
        }

        .six:hover {
            background-color: var(--accent-pink-soft);
            color: var(--accent-pink);
        }

        .main-container {
            max-width: 1280px;
            margin: 40px auto 80px auto;
            padding: 0 24px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 32px;
            text-align: left;
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .order-headers {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 12px 16px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-subtle);
            margin-bottom: 20px;
        }

        .order-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-primary);
            padding: 16px;
            align-items: center;
        }

        .order-wrapper {
            margin-bottom: 24px;
            border: 1px solid var(--border-subtle);
            background-color: var(--bg-card);
        }

        .product-preview-box {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: var(--bg-main);
            padding: 16px 24px;
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
        }

        .product-preview-box img {
            width: 80px;
            height: 60px;
            object-fit: contain;
            background: #FFFFFF;
            padding: 4px;
            border: 1px solid var(--border-subtle);
        }

        .product-preview-title {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .product-preview-name {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .progress-section {
            width: 100%;
            padding: 20px 24px;
            background-color: var(--bg-card);
        }

        .progress-track-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .progress-bar-container {
            position: relative;
            flex-grow: 1;
            background-color: var(--border-subtle);
            border-radius: 2px;
            height: 8px;
            margin-right: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-pink);
            width: 0%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .cycle-icon {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 28px;
            object-fit: contain;
            transition: left 0.5s ease;
            z-index: 2;
        }

        .home-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .progress-text {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-top: 12px;
            text-align: left;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            padding: 0 24px;
            background-color: #111318;
            color: #FFFFFF;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: background-color 0.15s ease;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--accent-pink);
        }

        .btn-clear {
            background-color: var(--bg-main);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }

        .btn-clear:hover {
            background-color: var(--border-subtle);
            color: var(--text-primary);
        }

        .copyright {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-subtle);
            padding: 32px 24px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-subtle);
            letter-spacing: 0.05em;
            margin-top: 80px;
        }

        @media (max-width: 1024px) {
            .order-headers, .order-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .order-headers {
                display: none;
            }
            .order-row {
                padding: 16px;
                border-bottom: 1px solid var(--border-subtle);
            }
        }
    </style>
</head>

<body>
    <div class="two">
        <a class="five" href="index.html">HOME</a>
        <a class="five" href="shop.html">SHOP NOW</a>
        <a class="five active" href="oder.html">ORDERS</a>
    </div>

    <div class="three">
        <h1>Click here to register your free ride today</h1>
        <a class="six" href="register.html">CLICK HERE</a>
    </div>

    <div class="main-container">
        <div class="card">
            <h2>Order Details</h2>

            <div class="order-headers">
                <div class="col">Email</div>
                <div class="col">Delivery Address</div>
                <div class="col">Bike</div>
                <div class="col">Amount</div>
                <div class="col">Date</div>
                <div class="col">Time</div>
                <div class="col">Expected Delivery</div>
            </div>

            <div class="orders-container" id="orders-container"></div>

            <div class="btn-group">
                <a href="index.html" class="btn">Home</a>
                <button onclick="clearOrders()" class="btn btn-clear">Clear History</button>
            </div>
        </div>
    </div>

    <div class="copyright">
        <p>© 2026 Shashwat Singh. All rights reserved.</p>
    </div>

    <script>
        const bikeNames = {
            "MTB": "1. MTB ST20",
            "ENDURANCE": "2. ENDURANCE EXPL 40",
            "EXPL 10": "EXPL 10",
            "EXPL10": "EXPL 10",
            "RODIE": "3. ROADIE RC 120",
            "ROADIE": "3. ROADIE RC 120",
            "FIXIE": "4. FIXIE RC 150",
            "HYBRID": "5. HYBRID RIVERSIDE 500",
            "RIVERSIDE 120": "6. HYBRID RIVERSIDE 120",
            "RIVERSIDE120": "6. HYBRID RIVERSIDE 120",
            "ST100": "ST100",
            "VAN RYSEL RCR-R PRO": "VAN RYSEL RCR-R PRO",
            "ST50": "ROCKRIDER MTB (ST50)",
            "ST200": "ROCKRIDER MTB (ST 200)",
            "ST30": "ROCKRIDER MTB (ST30)"
        };

        const bikeImages = {
            "MTB": "img5.png",
            "ENDURANCE": "img7.png",
            "EXPL 10": "img40.png",
            "EXPL10": "img40.png",
            "RODIE": "img6.png",
            "ROADIE": "img6.png",
            "FIXIE": "img8.png",
            "HYBRID": "img9.png",
            "RIVERSIDE 120": "img30.png",
            "RIVERSIDE120": "img30.png",
            "ST100": "img50.png",
            "VAN RYSEL RCR-R PRO": "img60.png",
            "ST50": "img70.png",
            "ST200": "img80.png",
            "ST30": "img90.png"
        };

        const orders = JSON.parse(localStorage.getItem('ordersList')) || [];
        const container = document.getElementById('orders-container');

        function updateProgressBars() {
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<div style="padding: 20px; color: #5E6470; font-size: 0.88rem;">No orders found.</div>';
                return;
            }

            const now = new Date().getTime();

            orders.forEach((order) => {
                let deliveryTimeStr = '30 Mins';
                let progressPercent = 0;
                let statusText = '';

                let orderTimestamp = now;

                if (order.date && order.time) {
                    const parsedDate = new Date(`${order.date} ${order.time}`);

                    if (!isNaN(parsedDate.getTime())) {
                        orderTimestamp = parsedDate.getTime();
                    }
                }

                const totalDuration = 30 * 60 * 1000;
                const deliveryTimestamp = orderTimestamp + totalDuration;
                const timePassed = now - orderTimestamp;
                const timeRemaining = deliveryTimestamp - now;

                const delDate = new Date(deliveryTimestamp);

                const formattedTime = delDate.toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const formattedDate = delDate.toLocaleDateString([], {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });

                const formattedFullDateTime = `${delDate.toLocaleDateString([], {
                    day: '2-digit',
                    month: 'short'
                })}, ${formattedTime}`;

                if (timeRemaining <= 0) {
                    progressPercent = 100;
                    deliveryTimeStr = formattedFullDateTime;
                    statusText = `Delivered on ${formattedDate} at ${formattedTime}`;
                } else if (timePassed < 0) {
                    progressPercent = 0;
                    deliveryTimeStr = formattedTime;
                    statusText = 'Order Placed';
                } else {
                    progressPercent = Math.min(
                        100,
                        Math.max(0, (timePassed / totalDuration) * 100)
                    );

                    deliveryTimeStr = formattedTime;

                    const minsLeft = Math.ceil(timeRemaining / (1000 * 60));

                    statusText = `Delivery Progress: ${minsLeft} mins remaining`;
                }

                const cycleKey = order.cycle
                    ? order.cycle.toUpperCase().trim()
                    : '';

                const displayBike = bikeNames[cycleKey] || order.cycle || 'N/A';

                let productImage = 'cycle67.png';
                if (cycleKey.includes("VAN RYSEL")) {
                    productImage = "img60.png";
                } else if (bikeImages[cycleKey]) {
                    productImage = bikeImages[cycleKey];
                }

                const displayAmount = (
                    cycleKey === "RIVERSIDE 120" ||
                    cycleKey === "RIVERSIDE120" ||
                    cycleKey === "6. HYBRID RIVERSIDE 120"
                ) ? "99,999" : (order.amount || '0');

                const wrapper = document.createElement('div');
                wrapper.className = 'order-wrapper';

                wrapper.innerHTML = `
                    <div class="order-row">
                        <div class="col">${order.email || 'N/A'}</div>
                        <div class="col">${order.address || 'N/A'}</div>
                        <div class="col">${displayBike}</div>
                        <div class="col">₹${displayAmount}</div>
                        <div class="col">${order.date || 'N/A'}</div>
                        <div class="col">${order.time || 'N/A'}</div>
                        <div class="col">${deliveryTimeStr}</div>
                    </div>

                    <div class="product-preview-box">
                        <img src="${productImage}" alt="${displayBike}">
                        <div class="product-preview-details">
                            <div class="product-preview-title">Your Ordered Product</div>
                            <div class="product-preview-name">${displayBike}</div>
                        </div>
                    </div>

                    <div class="progress-section">
                        <div class="progress-track-wrapper">
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${progressPercent.toFixed(1)}%;"></div>
                                <img src="cycle67.png" alt="Bike" class="cycle-icon" style="left: ${progressPercent.toFixed(1)}%;">
                            </div>
                            <img src="house67.png" alt="House" class="home-icon">
                        </div>
                        <div class="progress-text">${statusText}</div>
                    </div>
                `;

                container.appendChild(wrapper);
            });
        }

        updateProgressBars();

        setInterval(updateProgressBars, 10000);

        function clearOrders() {
            localStorage.removeItem('ordersList');
            location.reload();
        }
    </script>
</body>
</html>
