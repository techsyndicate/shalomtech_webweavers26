<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">


    <title>Order Summary</title>

    <style>
        * {

            box-sizing: border-box;
            color: black;
        }

        body {
            margin: 0;
             font-family: "Roboto Condensed", sans-serif;
        }

        .card {
            width: 100%;
            max-width: 850px;
            background-color: white;
            padding: 30px;
            border: 1px solid lightgray;
            border-radius: 8px;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 10px;
        }

        .order-headers {
            display: flex;
            justify-content: space-between;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #333333;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: bold;
            color: #555555;
            text-transform: uppercase;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #eeeeee;
            gap: 15px;
        }

        .order-row:last-child {
            border-bottom: none;
        }

        .col {
            flex: 1;
            word-break: break-word;
            font-size: 14px;
        }

        .orders-container {
            margin-bottom: 25px;
            max-height: 350px;
            overflow-y: auto;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
        }

        .btn:hover {
            background-color: #333333;
        }

        .btn-clear {
            background-color: #d9534f;
        }

        .btn-clear:hover {
            background-color: #c9302c;
        }
         .two {
        background: black;
        height: 35px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 35px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .five {
        color: white;
        text-decoration: none;
        font-size: 14px;
    }

    .five:hover {
        color: orange;
    }

    .three {
        background: #f2f2f2;
        height: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 35px;
        z-index: 99;
    }

    .three h1 {
        font-size: 13px;
    }

    .six {
        color: black;
        text-decoration: none;
        font-size: 12px;
        font-weight: bold;
        border-bottom: 1px solid;
    }

    .six:hover {
        color: grey;
    }
    </style>
</head>

<body>
     <div class="two">
        <a class="five" href="index.html">HOME</a>
        <a class="five" href="shop.html">SHOP NOW</a>
        <a class="five" href="oder.html">ORDERS</a>

    </div>

    <div class="three">
        <h1>Click here to register your free ride today</h1>
        <a class="six" href="register.html">CLICK HERE</a>
    </div>
<br>
<br>
<center>
    <div class="card">
        <h2>Order Details</h2>

        <div class="order-headers">
            <div class="col">Email</div>
            <div class="col">Bike</div>
            <div class="col">Amount</div>
            <div class="col">Date</div>
            <div class="col">Time</div>
            <div class="col">Expected Delivery</div>
        </div>

        <div class="orders-container" id="orders-container">
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn">Home</a>
            <button onclick="clearOrders()" class="btn btn-clear">Clear History</button>
        </div>
    </div>
</center>
    <script>
        const orders = JSON.parse(localStorage.getItem('ordersList')) || [];
        const container = document.getElementById('orders-container');

        if (orders.length === 0) {
            container.innerHTML = '<div style="padding: 20px; color: #888;">No orders found.</div>';
        } else {
            orders.forEach((order, index) => {
                let deliveryDateStr = 'N/A';
                
                if (order.date) {
                    const orderDate = new Date(order.date);
                    if (!isNaN(orderDate)) {
                        orderDate.setDate(orderDate.getDate() + 7);
                        deliveryDateStr = orderDate.toLocaleDateString();
                    }
                }

                const row = document.createElement('div');
                row.className = 'order-row';
                row.innerHTML = `
                    <div class="col">${order.email}</div>
                    <div class="col">${index + 1}. ${order.cycle}</div>
                    <div class="col">₹${order.amount}</div>
                    <div class="col">${order.date}</div>
                    <div class="col">${order.time}</div>
                    <div class="col">${deliveryDateStr}</div>
                `;
                container.appendChild(row);
            });
        }

        function clearOrders() {
            localStorage.removeItem('ordersList');
            location.reload();
        }
    </script>

</body>
</html>
