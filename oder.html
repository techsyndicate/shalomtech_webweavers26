<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="2.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <title>Order Summary</title>

   

</head>

<body>
    <div class="two">
        <a class="five" href="index.html">HOME</a>
        <a class="five" href="shop.html">SHOP NOW</a>
        <a class="five" href="oder.html">ORDERS</a>
    </div>

    <div class="three">
        <h1>Click here to register your free ride today</h1>
        <a class="six" href="register.html">CLICK HERE</a>
    </div>

    <br><br>

    <center>
        <div class="card">
            <h2>Order Details</h2>

            <div class="order-headers">
                <div class="col">Email</div>
                <div class="col">Delivery Address</div>
                <div class="col">Bike</div>
                <div class="col">Amount</div>
                <div class="col">Date</div>
                <div class="col">Time</div>
                <div class="col">Expected Delivery</div>
            </div>

            <div class="orders-container" id="orders-container">
            </div>

            <div class="btn-group">
                <a href="index.html" class="btn">Home</a>
                <button onclick="clearOrders()" class="btn btn-clear">Clear History</button>
            </div>
        </div>
    </center>

    <script>
        const bikeNames = {
            "MTB": "1. MTB ST20",
            "ENDURANCE": "2. ENDURANCE EXPL 40",
            "RODIE": "3. ROADIE RC 120",
            "ROADIE": "3. ROADIE RC 120",
            "FIXIE": "4. FIXIE RC 150",
            "HYBRID": "5. HYBRID RIVERSIDE 500"
        };

        const orders = JSON.parse(localStorage.getItem('ordersList')) || [];
        const container = document.getElementById('orders-container');

        if (orders.length === 0) {
            container.innerHTML = '<div style="padding: 20px; color: #888;">No orders found.</div>';
        } else {
            orders.forEach((order) => {
                let deliveryDateStr = 'N/A';
                
                if (order.date) {
                    const orderDate = new Date(order.date);
                    if (!isNaN(orderDate)) {
                        orderDate.setDate(orderDate.getDate() + 7);
                        deliveryDateStr = orderDate.toLocaleDateString();
                    }
                }

                // Match cycle name or fallback to original value
                const cycleKey = order.cycle ? order.cycle.toUpperCase() : '';
                const displayBike = bikeNames[cycleKey] || order.cycle;

                const row = document.createElement('div');
                row.className = 'order-row';
                row.innerHTML = `
                    <div class="col">${order.email}</div>
                    <div class="col">${order.address || 'N/A'}</div>
                    <div class="col">${displayBike}</div>
                    <div class="col">₹${order.amount}</div>
                    <div class="col">${order.date}</div>
                    <div class="col">${order.time}</div>
                    <div class="col">${deliveryDateStr}</div>
                `;
                container.appendChild(row);
            });
        }

        function clearOrders() {
            localStorage.removeItem('ordersList');
            location.reload();
        }
    </script>

</body>
</html>
