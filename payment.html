<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Payment</title>

    <style>
        * {
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            color: black;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .a {
            width: 100%;
            max-width: 440px;
            background-color: white;
            padding: 25px;
            border: 1px solid lightgray;
            border-radius: 8px;
        }

        .b {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }

        input[type="email"],
        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid lightgray;
            border-radius: 4px;
            background-color: white;
        }

        input:focus,
        select:focus {
            border-color: black;
            outline: none;
        }

        .c {
            border: 1px solid lightgray;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .d {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .e {
            border: 1px solid lightgray;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .f {
            position: relative;
            border-bottom: 1px solid lightgray;
        }

        .f input {
            border: none;
            border-radius: 0;
            padding-right: 130px;
        }

        .g {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            display: flex;
            gap: 4px;
        }

        .g span {
            background-color: #eeeeee;
            padding: 3px;
        }

        .h {
            display: flex;
        }

        .h input {
            width: 50%;
            border: none;
            border-radius: 0;
        }

        .h input:first-child {
            border-right: 1px solid lightgray;
        }

        .i {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            border: 1px solid lightgray;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .i input[type="checkbox"] {
            margin-top: 3px;
            width: 16px;
            height: 16px;
            accent-color: black;
        }

        .j strong {
            display: block;
            font-size: 14px;
        }

        .j span {
            font-size: 12px;
        }

        .k {
            width: 100%;
            padding: 12px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .k:hover {
            background-color: #333333;
        }

        .m {
            display: none;
            text-align: center;
            border: none;
            background: none;
            padding: 0;
            margin: 0;
        }

        .m h1 {
            font-size: 24px;
            color: black;
        }

        .m p {
            font-size: 16px;
            color: black;
        }
    </style>
</head>

<body>

    <div class="a">

        <form id="payment-form" onsubmit="handlePayment(event)">

            <div class="b" style="margin-top: 0;">Contact information</div>

            <div style="margin-bottom: 20px;">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="email@example.com" required>
            </div>

            <div class="b">Payment method</div>

            <div class="c">

                <div class="d">
                    Card
                </div>

                <label>Card information</label>

                <div class="e">

                    <div class="f">
                        <input type="text" placeholder="1234 1234 1234 1234" maxlength="19" required>

                        <div class="g">
                            <span>VISA</span>
                            <span>MC</span>
                            <span>AMEX</span>
                        </div>
                    </div>

                    <div class="h">
                        <input type="text" placeholder="MM / YY" maxlength="7" required>
                        <input type="text" placeholder="CVC" maxlength="4" required>
                    </div>

                </div>

                <div style="margin-bottom: 12px;">
                    <label>Cardholder name</label>
                    <input type="text" placeholder="Full name on card" required>
                </div>

                <div>
                    <label>Country or region</label>

                    <select>
                        <option value="IN">India</option>
                        <option value="US">United States</option>
                        <option value="GB">United Kingdom</option>
                        <option value="CA">Canada</option>
                        <option value="AU">Australia</option>
                    </select>
                </div>

            </div>

            <div class="i">

                <input type="checkbox" id="save-check">

                <div class="j">
                    <label for="save-check" style="margin: 0; cursor: pointer;">
                        <strong>Save my information for faster checkout</strong>
                        <span>Pay securely on this site and everywhere Link is accepted.</span>
                    </label>
                </div>

            </div>

            <button type="submit" class="k">Pay</button>

        </form>

        <div id="message-screen" class="m">
            <h1 id="status-heading">Processing Payment...</h1>
            <p id="status-text">Please wait while we process your secure payment.</p>
        </div>

    </div>

    <script>
        function handlePayment(event) {
            event.preventDefault();

            document.getElementById('payment-form').style.display = 'none';

            const messageScreen = document.getElementById('message-screen');
            const heading = document.getElementById('status-heading');
            const text = document.getElementById('status-text');

            messageScreen.style.display = 'block';

            setTimeout(() => {
                heading.innerText = "Payment Done!";
                text.innerText = "Redirecting you back to home...";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);

            }, 5000);
        }
    </script>

</body>
</html>
