<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="3.css">
    <title>Checkout Payment</title>
</head>

<body>

    <div class="a">

        <form id="payment-form" onsubmit="handlePayment(event)">

            <div class="b" style="margin-top: 0;">Contact information</div>

            <div style="margin-bottom: 20px;">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="email@example.com" required>
            </div>

            <div class="b">Delivery Address</div>

            <div style="margin-bottom: 20px;">
                <label for="address">Full Address</label>
                <textarea id="address" placeholder="House/Flat No., Street, Area, City, Pincode" required></textarea>
            </div>

            <div class="b">Select your cycle</div>

            <div id="cycle-image-container" style="margin-bottom: 15px; text-align: center; display: none;">
                <img id="cycle-preview-img" src="" alt="Cycle Preview" style="width: 320px; height: 200px; object-fit: contain; border-radius: 5px; border: 1px solid #ddd; padding: 4px; background: #fff;">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="cycle-select">Choose cycle type</label>
                <select id="cycle-select" onchange="updatePrice()" required>
                    <option value="" disabled selected>Select an option</option>
                    <option value="MTB">MTB ST20</option>
                    <option value="ST100">ST100</option>
                    <option value="ST50">ROCKRIDER MTB (ST50)</option>
                    <option value="ST200">ROCKRIDER MTB (ST 200)</option>
                    <option value="ST30">ROCKRIDER MTB (ST30)</option>
                    <option value="HYBRID">RIVERSIDE 500</option>
                    <option value="RIVERSIDE 120">RIVERSIDE 120</option>
                    <option value="RODIE">RODIE RC 120</option>
                    <option value="FIXIE">FIXIE RC 150</option>
                    <option value="ENDURANCE">ENDURANCE EXPL 40</option>
                    <option value="EXPL 10">ROCKRIDER EXPL 10</option>
                    <option value="VAN RYSEL RCR-R PRO">VAN RYSEL RCR-R PRO</option>
                </select>
            </div>

            <div class="b">Payment Amount</div>

            <div style="margin-bottom: 20px;">
                <label for="amount">Amount (₹)</label>
                <input type="text" id="amount" placeholder="Amount will appear here" readonly required>
            </div>

            <div class="b">Payment method</div>

            <div style="margin-bottom: 15px;">
                <label for="payment-method-select">Choose Payment Method</label>
                <select id="payment-method-select" onchange="togglePaymentMethod()" required>
                    <option value="card" selected>Card</option>
                    <option value="cod">Cash on Delivery (COD)</option>
                </select>
            </div>

            <div class="c" id="card-fields">

                <div class="d">
                    Card
                </div>

                <label>Card information</label>

                <div class="e">

                    <div class="f">
                        <input type="text" class="card-input" placeholder="1234 1234 1234 1234" maxlength="19" oninput="this.value = this.value.replace(/[^0-9\s]/g, '')" required>

                        <div class="g">
                            <span>VISA</span>
                            <span>MC</span>
                            <span>AMEX</span>
                        </div>
                    </div>

                    <div class="h">
                        <input type="text" class="card-input" placeholder="MM / YY" maxlength="7" required>
                        <input type="text" class="card-input" placeholder="CVC" maxlength="4" oninput="this.value = this.value.replace(/\D/g, '')" required>
                    </div>

                </div>

                <div style="margin-bottom: 12px;">
                    <label>Cardholder name</label>
                    <input type="text" class="card-input" placeholder="Full name on card" required>
                </div>

                <div>
                    <label>Country or region</label>

                    <select>
                        <option value="IN">India</option>
                        <option value="US">United States</option>
                        <option value="GB">United Kingdom</option>
                        <option value="CA">Canada</option>
                        <option value="AU">Australia</option>
                    </select>
                </div>

            </div>

            <div id="cod-fields" style="display: none; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; margin-bottom: 15px;">
                <p style="margin: 0; color: #333; font-weight: 500;">Pay with cash upon delivery of your item.</p>
            </div>

            <button type="submit" class="k" id="submit-btn">Pay</button>

        </form>

        <div id="message-screen" class="m">
            <h1 id="status-heading">Processing Payment...</h1>
            <p id="status-text">Please wait while we process your secure payment.</p>
        </div>

    </div>

    <script>
        function updatePrice() {
            const cycle = document.getElementById('cycle-select').value;
            const amountInput = document.getElementById('amount');
            const previewContainer = document.getElementById('cycle-image-container');
            const previewImg = document.getElementById('cycle-preview-img');

            const prices = {
                "MTB": "28,999",
                "ST100": "19,999",
                "ST50": "15,999",
                "ST200": "16,999",
                "ST30": "19,999",
                "HYBRID": "98,999",
                "RIVERSIDE 120": "99,999",
                "RODIE": "39,999",
                "FIXIE": "99,999",
                "ENDURANCE": "48,999",
                "EXPL 10": "24,999",
                "VAN RYSEL RCR-R PRO": "5,99,999"
            };

            const images = {
                "MTB": "img5.png",
                "ST100": "img50.png",
                "ST50": "img70.png",
                "ST200": "img80.png",
                "ST30": "img90.png",
                "HYBRID": "img9.png",
                "RIVERSIDE 120": "img30.png",
                "RODIE": "img6.png",
                "FIXIE": "img8.png",
                "ENDURANCE": "img7.png",
                "EXPL 10": "img40.png",
                "VAN RYSEL RCR-R PRO": "img60.png"
            };

            if (prices[cycle] !== undefined) {
                amountInput.value = prices[cycle];
            }

            if (images[cycle]) {
                previewImg.src = images[cycle];
                previewContainer.style.display = 'block';
            } else {
                previewContainer.style.display = 'none';
            }
        }

        function togglePaymentMethod() {
            const method = document.getElementById('payment-method-select').value;
            const cardFields = document.getElementById('card-fields');
            const codFields = document.getElementById('cod-fields');
            const cardInputs = document.querySelectorAll('.card-input');
            const submitBtn = document.getElementById('submit-btn');

            if (method === 'cod') {
                cardFields.style.display = 'none';
                codFields.style.display = 'block';
                submitBtn.innerText = 'Place Order';
                cardInputs.forEach(input => input.removeAttribute('required'));
            } else {
                cardFields.style.display = 'block';
                codFields.style.display = 'none';
                submitBtn.innerText = 'Pay';
                cardInputs.forEach(input => input.setAttribute('required', 'required'));
            }
        }

        function handlePayment(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const address = document.getElementById('address').value;
            const cycle = document.getElementById('cycle-select').value;
            const amount = document.getElementById('amount').value;
            const paymentMethod = document.getElementById('payment-method-select').value;
            const now = new Date();

            const newOrder = {
                email: email,
                address: address,
                cycle: cycle,
                amount: amount,
                paymentMethod: paymentMethod === 'cod' ? 'Cash on Delivery' : 'Card',
                date: now.toLocaleDateString(),
                time: now.toLocaleTimeString()
            };

            const existingOrders = JSON.parse(localStorage.getItem('ordersList')) || [];
            existingOrders.push(newOrder);

            localStorage.setItem('ordersList', JSON.stringify(existingOrders));

            document.getElementById('payment-form').style.display = 'none';

            const messageScreen = document.getElementById('message-screen');
            const heading = document.getElementById('status-heading');
            const text = document.getElementById('status-text');

            messageScreen.style.display = 'block';

            if (paymentMethod === 'cod') {
                heading.innerText = "Order Placed!";
                text.innerText = "Redirecting to your order summary...";
                setTimeout(() => {
                    window.location.href = "oder.html";
                }, 1500);
            } else {
                heading.innerText = "Processing Payment...";
                text.innerText = "Please wait while we process your secure payment.";
                setTimeout(() => {
                    heading.innerText = "Payment Done!";
                    text.innerText = "Redirecting to your order summary...";

                    setTimeout(() => {
                        window.location.href = "oder.html";
                    }, 2000);

                }, 3000);
            }
        }
    </script>

</body>
</html>
